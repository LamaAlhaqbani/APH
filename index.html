<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستشفى إرادة والصحة النفسية بأبها - لوحة مؤشرات الأداء التنفيذية</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        medical: {
                            50: '#f0f4f8',
                            100: '#d9e2ec',
                            600: '#0284c7',
                            800: '#0369a1',
                            900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- MAIN APP WRAPPER -->
    <div id="main-app" class="flex flex-col min-h-screen">
        
        <!-- HEADER - EXECUTIVE NAVY BLUE -->
        <header class="executive-header text-white border-b border-sky-950 sticky top-0 z-40 shadow-xl bg-gradient-to-r from-sky-950 via-sky-900 to-sky-950">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-24 flex items-center justify-between">
                
                <!-- شعار المستشفى والعنوان (محدث وبحجم احترافي وخلفية شفافة أنيقة) -->
                <div class="flex items-center space-x-4 space-x-reverse">
                    <div class="w-16 h-16 bg-white/10 backdrop-blur-md rounded-2xl p-2 flex items-center justify-center border border-white/20 shadow-inner transition-transform hover:scale-105 duration-300">
                        <img src="logo.png" alt="شعار المستشفى" class="w-full h-full object-contain filter drop-shadow-md">
                    </div>
                    <div class="border-r-2 border-sky-600/60 pr-4 mr-1">
                        <h2 class="text-base sm:text-lg font-bold text-white tracking-wide leading-tight">مستشفى إرادة والصحة النفسية بأبها</h2>
                        <p class="text-xs text-sky-300 font-medium mt-1">تجمع عسير الصحي - لوحة مؤشرات الأداء التنفيذية</p>
                    </div>
                </div>

                <!-- معلومات المستخدم وأزرار التنقل التفاعلية المُحسّنة -->
                <div class="flex items-center space-x-3 space-x-reverse">
                    
                    <!-- شريحة المستخدم -->
                    <div id="user-badge" class="hidden sm:flex items-center bg-sky-900/80 px-3.5 py-1.5 rounded-full border border-sky-700/50 shadow-sm">
                        <i class="fa-solid fa-shield-halved ml-2 text-amber-400"></i>
                        <span id="current-user-display" class="text-xs font-semibold text-sky-100">عبد العزيز عبدالله آل زربه (Admin)</span>
                    </div>

                    <!-- أزرار التنقل الرئيسية بتصميم فخم واحترافي -->
                    <div class="flex items-center space-x-2 space-x-reverse bg-sky-950/60 p-1.5 rounded-2xl border border-sky-800/40 shadow-inner">
                        <button onclick="enterPresentationMode()" class="px-3.5 py-2 text-xs font-bold rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white shadow-md transition-all duration-200 flex items-center gap-1.5 transform hover:-translate-y-0.5">
                            <i class="fa-solid fa-desktop ml-1"></i>
                            وضع العرض السريع
                        </button>

                        <button onclick="switchTab('dashboard')" id="nav-btn-dashboard" class="px-3.5 py-2 text-xs font-bold rounded-xl bg-sky-800 text-white shadow transition-all duration-200 flex items-center gap-1.5">
                            <i class="fa-solid fa-chart-pie ml-1"></i>
                            لوحة المؤشرات
                        </button>

                        <button onclick="switchTab('data-entry')" id="nav-btn-entry" class="px-3.5 py-2 text-xs font-semibold rounded-xl text-sky-200 hover:bg-sky-800/50 hover:text-white transition-all duration-200 flex items-center gap-1.5">
                            <i class="fa-solid fa-pen-to-square ml-1"></i>
                            إدخال وتعديل البيانات
                        </button>
                    </div>

                </div>
            </div>
        </header>

        <!-- محتوى لوحة المؤشرات الرئيسي -->
        <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <!-- بطاقة إحصائية تجريبية كمثال -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:shadow-md transition-shadow">
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">إجمالي المؤشرات النشطة</span>
                        <div class="w-10 h-10 rounded-xl bg-sky-50 text-sky-600 flex items-center justify-center font-bold">
                            <i class="fa-solid fa-chart-line"></i>
                        </div>
                    </div>
                    <div class="text-2xl font-black text-slate-900">24 مؤشراً</div>
                    <div class="text-xs text-emerald-600 font-medium mt-1 flex items-center gap-1">
                        <i class="fa-solid fa-arrow-up"></i> تحديث مستمر للأداء
                    </div>
                </div>
            </div>
        </main>
        
    </div>

</body>
</html>
